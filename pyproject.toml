[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parchi"
version = "0.1.0"
description = "Turn WhatsApp grocery orders into bills with a local open-weight model. Nothing leaves the shop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "rapidfuzz>=3", "qrcode>=7.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
parchi = "parchi.app:main"

[tool.setuptools]
packages = ["parchi"]

[tool.setuptools.package-data]
parchi = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
